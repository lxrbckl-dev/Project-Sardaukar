# Organization Configuration
# This is the single source of truth for all managed GitHub organizations.
# TPM reads from this file — never hardcode org names elsewhere.
#
# To add a new org:
#   1. Add an entry below
#   2. Restart the TPM session

organizations:
  - name: t5-labs
    project_number: 1
    project_url: https://github.com/orgs/t5-labs/projects/1
  - name: lxrbckl-labs
    project_number: 1
    project_url: https://github.com/orgs/lxrbckl-labs/projects/1
