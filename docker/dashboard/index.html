<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sardaukar — Agent Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .agents {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
        }
        .agent {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .agent-name {
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .agent-name.tpm { color: #f78166; }
        .agent-name.swe { color: #7ee787; }
        .agent-name.qa { color: #79c0ff; }
        .agent-role {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 2px;
        }
        .connect-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
        }
        .connect-btn:hover { background: #2ea043; }
        .connect-btn.offline {
            background: #30363d;
            color: #8b949e;
            cursor: default;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-dot.online { background: #3fb950; }
        .status-dot.offline { background: #6e7681; }
        .refresh-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #6e7681;
        }
    </style>
</head>
<body>
    <h1>Sardaukar</h1>
    <p class="subtitle">Agent remote-control dashboard</p>
    <div class="agents" id="agents">
        <div class="agent"><span style="color: #8b949e;">Loading...</span></div>
    </div>
    <p class="refresh-note">Auto-refreshes every 10 seconds</p>

    <script>
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        const ROLES = {
            tpm: 'Coordinator',
            qa: 'Reviewer',
        };

        function getRole(name) {
            if (ROLES[name]) return ROLES[name];
            if (name.startsWith('swe')) return 'Developer';
            return 'Agent';
        }

        function getClass(name) {
            if (name === 'tpm') return 'tpm';
            if (name.startsWith('swe')) return 'swe';
            if (name === 'qa') return 'qa';
            return '';
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const sessions = await res.json();
                const container = document.getElementById('agents');

                if (sessions.length === 0) {
                    container.innerHTML = '<div class="agent"><span style="color: #8b949e;">No agents running</span></div>';
                    return;
                }

                container.innerHTML = sessions.map(s => `
                    <div class="agent">
                        <div>
                            <span class="status-dot ${s.url ? 'online' : 'offline'}"></span>
                            <span class="agent-name ${getClass(s.name)}">${esc(s.name)}</span>
                            <div class="agent-role">${esc(getRole(s.name))}</div>
                        </div>
                        ${s.url
                            ? `<a href="${esc(s.url)}" class="connect-btn" target="_blank" rel="noopener">Connect</a>`
                            : `<span class="connect-btn offline">Offline</span>`
                        }
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load sessions:', err);
            }
        }

        loadSessions();
        setInterval(loadSessions, 10000);
    </script>
</body>
</html>
